name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dd_starter
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dd_starter
      PAYLOAD_SECRET: ci-only-payload-secret-with-at-least-32-chars
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-chars
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PREVIEW_SECRET: ci-only-preview-secret
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: pnpm check

      - name: Migrate
        run: pnpm payload migrate

      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build
